  <div>
    <h2 style="text-align: center; font-weight: bold;">Gestionar Árbol de Objetivos</h2>
  </div>

  <div *ngIf="proyectos?.length==0" class="alert alert-info">
    No hay registros en la base de datos
  </div>

  <div class="card-header">
    <div class="d-flex gap-2"> 
        <button 
            pButton pRipple type="button" 
            name="crear" 
            (click)="generarArbolDeObjetivos()" 
            icon="pi pi-file" class="p-button-rounded p-button-info p-button-text" 
            pTooltip="Crear árbol de objetivos"
            [disabled]="existeArbolDeObjetivos">
            Generar Árbol de Objetivos
        </button>
    </div>    
  </div>

<p-table [value]="arbolesDeObjetivosMediosFines" [tableStyle]="{'min-width': '50rem' } ">
    <ng-template pTemplate="header" let-columns>
        <tr>
            <th>Id</th>
            <th>Descripción del Árbol de Objetivos</th>
            <th>Acciones</th>
        </tr>
    </ng-template>
    <ng-template  pTemplate="body" let-arbolObjetivosMF let-columns="columns" >
        <tr >
            <td>
                {{arbolObjetivosMF.arbolDeObjetivos.id}}
            </td>
            <td>
                {{arbolObjetivosMF.arbolDeObjetivos.descripcion}}
            </td>
            <td>
                <button pButton pRipple type="button" name="ver detalle" (click)='mostrarDetalleArbolDeObjetivos(arbolObjetivosMF)' icon="pi pi-eye" class="p-button-rounded p-button-secondary p-button-text" pTooltip="Ver detalle árbol de objetivos"></button>
                <button pButton pRipple type="button" name="editar arboldeobjetivos" [routerLink]="['/investigador/proyectosinvestigador/formarboldeobjetivosinvest', arbolObjetivosMF.arbolDeObjetivos.id]" icon="pi pi-file-edit" class="p-button-rounded p-button-text" pTooltip="Editar árbol de objetivos"></button>
                <button pButton pRipple type="button" name="eliminar" (click)='eliminarArbolDeObjetivos(arbolObjetivosMF)' icon="pi pi-trash" class="p-button-rounded p-button-info p-button-text" pTooltip="Eliminar árbol de objetivos"></button>
            </td>
        </tr>
    </ng-template>
</p-table>

<div class="form-group mt-5 d-flex justify-content-between align-items-center gap-3">
  <button class="btn btn-primary"
          (click)="regresarAlArbolDeProblemas()">
    Regresar Al Árbol De Problemas
  </button>

  <button class="btn btn-primary"
          (click)="irALasActividadesDelProyecto()">
    Ir Al Cronograma De Actividades
  </button>
</div>

  <p-dialog header="Detalles del Árbol de Objetivos" [modal]="true" [(visible)]="visibleDetalleArbolDeObjetivos" [style]="{ width: '25rem' }">
      <div *ngIf="arbolDeObjetivosMediosFinesSeleccionado">
        <!--
        <div class="flex align-items-center gap-3 mb-3" class="form-group">
            <label for="proyectoId" class="font-semibold w-10rem">Id del Proyecto</label>
            <input pInputText id="proyectoId" [(ngModel)]="arbolDeObjetivosMediosFinesSeleccionado.arbolDeObjetivos.id" class="flex-auto" autocomplete="off" readonly />
        </div>
        -->
        <!--
          <div class="flex align-items-center gap-3 mb-3" class="form-group">
              <label for="nombre" class="font-semibold w-6rem">Nombre</label>
              <input pInputText id="nombre" [(ngModel)]="arbolDeObjetivosMediosFinesSeleccionado.arbolDeObjetivos.nombre" class="flex-auto" autocomplete="off" readonly />
          </div>
        -->  
          <div class="flex align-items-center gap-3 mb-5" class="form-group">
              <label for="descripcion" class="font-semibold w-6rem">Descripción</label>
              <input pInputText id="descripcion" [(ngModel)]="arbolDeObjetivosMediosFinesSeleccionado.arbolDeObjetivos.descripcion" class="flex-auto" autocomplete="off" readonly />
          </div>
          <!-- Listado de medios -->
        <div class="flex align-items-center gap-3 mb-4" class="form-group">
        <h4 style="margin-bottom: 0.5rem;">Medios</h4>
        <ul *ngIf="arbolDeObjetivosMediosFinesSeleccionado.mediosArbolDeObjetivos?.length > 0; else sinMedios">
            <li *ngFor="let medio of arbolDeObjetivosMediosFinesSeleccionado.mediosArbolDeObjetivos">
               <input pInputText id="descripcionmedio" [(ngModel)]="medio.descripcion" class="flex-auto" autocomplete="off" readonly />
            </li>
        </ul>
        <ng-template #sinMedios>
            <p class="text-muted">No hay medios registrados.</p>
        </ng-template>
        </div>

        <!-- Listado de fines -->
        <div class="flex align-items-center gap-3 mb-4" class="form-group">
        <h4 style="margin-bottom: 0.5rem;">Fines</h4>
        <ul *ngIf="arbolDeObjetivosMediosFinesSeleccionado.finesArbolDeObjetivos?.length > 0; else sinFines">
            <li *ngFor="let fin of arbolDeObjetivosMediosFinesSeleccionado.finesArbolDeObjetivos">
                <input pInputText id="descripcionfin" [(ngModel)]="fin.descripcion" class="flex-auto" autocomplete="off" readonly />
            </li>
        </ul>
        <ng-template #sinFines>
            <p class="text-muted">No hay fines registrados.</p>
        </ng-template>
        </div>
      </div>
      <div class="flex justify-content-end gap-2">
          <p-button label="Cerrar" severity="secondary" (onClick)="visibleDetalleArbolDeObjetivos = false"></p-button>
      </div>
  </p-dialog>

</body>
</html>
