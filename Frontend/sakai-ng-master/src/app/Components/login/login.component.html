<div class="login-container">
    <form (ngSubmit)="onSubmit(f)" class="login-form" #f="ngForm" novalidate>
      <h1>Iniciar sesión</h1>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="loginUser.email" name="email" required placeholder="ejemplo@correo.com" #emailusuario="ngModel">
          <div *ngIf="emailusuario.invalid && emailusuario.touched" class="text-danger">
                <small *ngIf="emailusuario.errors?.['required']">El correo electrónico es obligatorio.</small>
          </div>
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" [(ngModel)]="loginUser.password" name="password" required placeholder="Ingresa tu contraseña" #passwordusuario="ngModel">
          <div *ngIf="passwordusuario.invalid && passwordusuario.touched" class="text-danger">
                <small *ngIf="passwordusuario.errors?.['required']">La contraseña es obligatoria.</small>
          </div>
      </div>
      <button type="submit" class="btn" [disabled]="!f.valid">Iniciar sesión</button>
      <!--<button type="button" (click)="onSubmit(f)">Probar validación</button>-->
      <!--<p class="error-message" *ngIf="error">{{ error }}</p>-->
       <div class="mt-3"
            *ngIf="validationError || globalError">
            <p class="error-message text-danger">
                <span *ngIf="validationError">
                    {{ validationError }}
                </span>
                <span *ngIf="validationError && globalError">
                    <br>
                </span>
                <span *ngIf="globalError">
                    {{ globalError }}
                </span>
            </p>
       </div>
      <p class="success-message" *ngIf="success">{{ success }}</p>
      <div class="form-footer">
        <a routerLink="/register">¿No tienes cuenta? Regístrate aquí</a>
        <a href="/email/send-email">Olvidé mi contraseña</a>
      </div>
    </form>
  </div>
