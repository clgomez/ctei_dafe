<div class="card bg-light text-black">
    <div class="card-header"><p-tag severity="primary" value="{{ titulo }}"></p-tag></div>
    <div class="card-body">
      <form (ngSubmit)="guardarAsignacionDeRoles(f)" class="register-form" #f="ngForm" novalidate> 
        <div class="form-group row">
          <label for="usuarioTutorId" class="col-form-label col-sm-2">Tutores</label>
          <div class="col-sm-6">
            <select id="usuarioTutor" [(ngModel)]="asignacionDeRoles.usuarioTutorId" name="usuarioTutorId" class="form-control" required>
                <option [ngValue]="null" disabled>Seleccione Tutor</option>
                <option *ngFor="let usuarioTutor of usuariosTutores" [value]="usuarioTutor.id">
                    {{ usuarioTutor.id }} - {{ usuarioTutor.nombre }} {{ usuarioTutor.apellidos }}
                </option>
              </select>
          </div>
        </div>
        <div class="form-group row">
            <label for="usuarioEvaluador" class="col-form-label col-sm-2">Evaluadores</label>
            <div class="col-sm-6">
                <select id="usuarioEvaluadorId" [(ngModel)]="asignacionDeRoles.usuarioEvaluadorId" name="usuarioEvaluadorId" class="form-control" required>
                    <option [ngValue]="null"  disabled>Seleccione Evaluador</option>
                    <option *ngFor="let usuarioEvaluador of usuariosEvaluadores" [value]="usuarioEvaluador.id">
                        {{ usuarioEvaluador.id }} - {{ usuarioEvaluador.nombre }} {{ usuarioEvaluador.apellidos }}
                    </option>
                  </select>
            </div>
        </div>
         <div class="form-actions">
            <button class="btn btn-primary-crear" [disabled]="!f.valid" type="submit" *ngIf="!asignacionDeRoles.id else elseBlock">Crear</button>
            <ng-template #elseBlock>
              <button class="btn btn-primary-editar" [disabled]="!f.valid" type="submit">Editar</button>
            </ng-template>
            <button class="btn btn-primary-cancelar" type="button" (click)='cancelarAsignacionDeRoles(asignacionDeRoles)'>Cancelar</button>
            <div class="mt-3"
              *ngIf="validationError || globalError">
              <p class="error-message text-danger">
                  <span *ngIf="validationError">
                      {{ validationError }}
                  </span>
                  <span *ngIf="validationError && globalError">
                      <br>
                  </span>
                  <span *ngIf="globalError">
                      {{ globalError }}
                  </span>
              </p>
           </div>
        </div>
      </form>
    </div>
  </div>
